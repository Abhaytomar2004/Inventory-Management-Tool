version: '3.8'
services:
  jenkins:
    image: jenkins/jenkins:lts
    privileged: true
    user: root
    ports:
      - 8080:8080
      - 50000:50000
    container_name: jenkins
    environment:
      - JENKINS_OPTS=--argumentsRealm.passwd.admin=your_password --argumentsRealm.roles.admin=admin
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project  # Mount current directory as project

volumes:
  jenkins_home:
    driver: local
