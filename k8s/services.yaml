apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql  # This should match your MySQL deployment's labels
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-management-tool-service
spec:
  type: NodePort
  selector:
    app: inventory-mangement-tool  # This should match your deployment's labels
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
      nodePort: 30001